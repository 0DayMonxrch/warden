version: "3.8"

# Secure Docker Compose manifest satisfying all Warden security rules
services:
  secure-app:
    image: nginx:alpine
    user: "10001:10001"
    privileged: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./html:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
